name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Installing from the pinned file is itself a test: a resolution conflict
      # here is exactly the defect that shipped once already.
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-seeker.txt
          pip check

      - name: Run tests
        run: pytest -q

  program:
    name: Stake program (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Host-target tests only. Building the SBF binary needs the Solana
      # platform tools, which are not worth installing for every push; the
      # decision logic these cover is the part that changes.
      - name: Run program logic tests
        run: cargo test -p seeker-bounty --lib

  android:
    name: Android (lint, unit tests, APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package list asks for `tools`, a package retired
      # from the SDK repository; sdkmanager exits 1 on it and takes the whole
      # job with it before Gradle ever starts.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The runner image does not carry API 37, and an auto-download mid-build
      # fails later and less legibly than an explicit install here.
      - name: Install the SDK packages the build compiles against
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Gated before the build: a lint regression or a broken pure function
      # should fail the run rather than ride along inside a green APK.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capture-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

