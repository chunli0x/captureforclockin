# Resolved against Google Maven and Maven Central on 2026-09-09, then verified
# by an actual build.
#
# compileSdk 37 and AGP 9 are not optional: mobile-wallet-adapter 2.2.0 requires
# consumers to compile against API 37 or later, and androidx.core 1.19 requires
# AGP 9.1+. Note the SDK platform package is "platforms;android-37.0" - Android
# platforms are minor-versioned now.
[versions]
agp = "9.4.0"
kotlin = "2.4.20"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
mwa = "2.2.0"
okhttp = "4.12.0"
coil = "3.6.2"
# CameraX + ML Kit for the on-device liveness check. Face detection runs
# locally: no image leaves the device, which is the claim the demo makes.
camerax = "1.6.2"
mlkitFace = "16.1.7"
# LiteRT runs the silent-face anti-spoofing model on device.
#
# Pinned below 2.1.6 deliberately. From 2.1.6 the runtime pulls in a separate
# `litert-api` artifact that declares the SAME namespace
# (com.google.ai.edge.litert), and AGP 9 rejects two libraries sharing one -
# the manifest merger fails before anything compiles. 2.1.5 is the newest
# release without that split.
litert = "2.1.5"
junit = "4.13.2"
sentry = "8.60.0"
# Media3 (ExoPlayer) for action-clip playback in the Seeker editor. Pinned to
# 1.9.0 to match the transitive media3-* the CameraX video stack already pulls.
media3 = "1.9.0"

[libraries]
# Core only: no replay, NDK dumps, HTTP or logging integrations.
sentry-android-core = { group = "io.sentry", name = "sentry-android-core", version.ref = "sentry" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
mwa-clientlib-ktx = { group = "com.solanamobile", name = "mobile-wallet-adapter-clientlib-ktx", version.ref = "mwa" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
camerax-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFace" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
