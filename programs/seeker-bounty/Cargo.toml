[package]
name = "seeker-bounty"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "seeker_bounty"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[dev-dependencies]
litesvm = "=0.12.0"
solana-account = "3.3"
solana-keypair = "~3.1"
solana-signer = "3.0"
solana-transaction = "~3.0"
